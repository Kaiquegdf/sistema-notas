<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Notas</title>
  <link rel="stylesheet" href="/style.css?v=2">
  <link rel="stylesheet" href="/navbar.css">
</head>
<body>

<main>
  <div class="card">
    <h2>Notas importadas</h2>

   <div class="top-links">
  <a href="/">Importar nova nota</a>

  <button onclick="abrirModalNotaManual()">
    Criar nota sem XML
  </button>
</div>
<div class="busca-nota">
  <label>Pesquisar nota</label>

  <input
    type="text"
    id="pesquisaNota"
    placeholder="Digite o número da nota"
    oninput="carregarNotas()"
  >
</div>

    <div id="modalNotaManual" class="modal" style="display:none;">
  <div class="card">
    <h2>Nova nota sem XML</h2>

    <label>Fornecedor</label>
    <input id="fornecedorManual">

    <br><br>

    <button onclick="salvarNotaManual()">
      Salvar
    </button>

    <button onclick="fecharModalNotaManual()">
      Cancelar
    </button>
  </div>
</div>
<div class="filtros-notas">

  <div>
    <label>Status</label><br>

    <select id="filtroStatus" onchange="carregarNotas()">
      <option value="">Todos</option>

      <option>Aguardando mercadoria</option>
      <option>Mercadoria recebida</option>
      <option>Liberada para estoque</option>
      <option>Em conferência</option>
      <option>Conferir ocorrências</option>
      <option>Iury</option>
      <option>Lançamento</option>
      <option>Marcação</option>
    </select>
  </div>

  <div>
    <label>Data inicial</label><br>
    <input type="date" id="filtroDataInicial" onchange="carregarNotas()">
  </div>

  <div>
    <label>Data final</label><br>
    <input type="date" id="filtroDataFinal" onchange="carregarNotas()">
  </div>

</div>

<br>

    <table>
      <thead>
       <tr>
        <th>Nota</th>
        <th>Fornecedor</th>
        <th>Data emissão</th>
        <th>Data recebimento</th>
        <th>Status</th>
        <th>Ação</th>
      </tr>
      </thead>
      <tbody id="listaNotas"></tbody>
    </table>
  </div>
</main>
<script src="/auth.js"></script>
<script src="/navbar.js?v=2"></script>
<script>
criarNavbar();
const paginaAtual = window.location.pathname;
function formatarData(data) {
  if (!data) return "-";

  data = String(data);

  if (data.includes("T")) {
    data = data.split("T")[0];
  }

  if (data.includes("-")) {
    const [ano, mes, dia] = data.split("-");

    return `${dia}/${mes}/${ano}`;
  }

  return data;
}

function classeStatus(texto) {
  if (!texto) return "status-alerta";

  const t = texto.toLowerCase();

  if (
    t.includes("conferida sem ocorrência") ||
    t.includes("marcada")
  ) {
    return "status-ok";
  }
  if (t.includes("aguardando xml")) {
  return "status-alerta";
}
  if (
    t.includes("ocorrência") ||
    t.includes("aguardando") ||
    t.includes("não liberada")
  ) {
    return "status-alerta";
  }

  return "status-alerta";
}

async function carregarNotas() {
  const resposta = await fetch("/notas");
  const notas = await resposta.json();
 
  const statusFiltro =
  document.getElementById("filtroStatus")?.value || "";

const dataInicial =
  document.getElementById("filtroDataInicial")?.value || "";

const dataFinal =
  document.getElementById("filtroDataFinal")?.value || "";

  const lista = document.getElementById("listaNotas");
  lista.innerHTML = "";
  
  const pesquisa =
  document.getElementById("pesquisaNota")?.value || "";

  const usuario = JSON.parse(localStorage.getItem("usuario"));

  const podeExcluir =
    usuario &&
    (
      usuario.cargo === "admin" ||
      usuario.cargo === "administrativo"
    );
const notasFiltradas = notas.filter(nota => {
  if (nota.status === "Finalizada") {
  return false;
}
  if (
    statusFiltro &&
    nota.status !== statusFiltro
  ) {
    return false;
  }

  if (
  pesquisa &&
  !String(nota.numero).includes(pesquisa)
    ) {
      return false;
    }

    if (dataInicial || dataFinal) {

    const dataNota = new Date(nota.data_recebimento || nota.data);

    if (dataInicial) {
      const inicio = new Date(dataInicial);

      if (dataNota < inicio) {
        return false;
      }
    }

    if (dataFinal) {
      const fim = new Date(dataFinal);

      fim.setHours(23, 59, 59, 999);

      if (dataNota > fim) {
        return false;
      }
    }
    if (
  pesquisa &&
  !String(nota.numero).includes(pesquisa)
) {
  return false;
}
  }

  return true;
});
notasFiltradas.sort((a, b) => {
  return a.fornecedor.localeCompare(
    b.fornecedor,
    "pt-BR"
  );
});
  notasFiltradas.forEach(nota => {
    lista.innerHTML += `
      <tr>
        <td>
          <strong>${nota.numero}</strong>
        </td>

        <td>${nota.fornecedor}</td>

        <td>${formatarData(nota.data)}</td>

        <td>${formatarData(nota.data_recebimento)}</td>

       <td>
  <select
    onchange="alterarStatusRapido(${nota.id}, this.value)"
  >
    <option ${nota.status === "Aguardando mercadoria" ? "selected" : ""}>
      Aguardando mercadoria
    </option>

    <option ${nota.status === "Mercadoria recebida" ? "selected" : ""}>
      Mercadoria recebida
    </option>

    <option ${nota.status === "Liberada para estoque" ? "selected" : ""}>
      Liberada para estoque
    </option>

    <option ${nota.status === "Em conferência" ? "selected" : ""}>
      Em conferência
    </option>

    <option ${nota.status === "Marcação" ? "selected" : ""}>
      Marcação
    </option>

    <option ${nota.status === "Finalizada" ? "selected" : ""}>
      Finalizada
    </option>
  </select>
</td>

   

  ${
    nota.status === "Aguardando XML"
      ? `
        <label class="botao-upload">
          Importar XML
          <input
            type="file"
            accept=".xml"
            onchange="importarXmlExistente(event, ${nota.id})"
            hidden
          >
        </label>
      `
      : ""
  }

  <td>
  <div class="acoes-nota">

    <a
      class="btn-abrir-nota"
      href="/nota.html?id=${nota.id}"
    >
      Abrir
    </a>

    <button
      class="btn-excluir-nota"
      onclick="excluirNota(${nota.id})"
    >
      Excluir
    </button>

  </div>
</td>
      </tr>
    `;
  });
}

async function excluirNota(id) {
  const confirmar = confirm("Tem certeza que deseja excluir esta nota?");

  if (!confirmar) return;

  await fetch(`/nota/${id}`, {
    method: "DELETE"
  });

  await carregarNotas();
}

async function salvarNotaManual() {
  const fornecedor =
    document.getElementById("fornecedorManual").value;

  const resposta = await fetch("/nota/manual", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      fornecedor
    })
  });

  const mensagem = await resposta.text();

  alert(mensagem);

  fecharModalNotaManual();

  await carregarNotas();
}

function abrirModalNotaManual() {
  document.getElementById("modalNotaManual").style.display = "flex";
}

function fecharModalNotaManual() {
  document.getElementById("modalNotaManual").style.display = "none";
}

async function salvarNotaManual() {
  const fornecedor =
    document.getElementById("fornecedorManual").value;

  if (!fornecedor.trim()) {
    alert("Informe o fornecedor");
    return;
  }

  const resposta = await fetch("/nota/manual", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      fornecedor
    })
  });

  const mensagem = await resposta.text();

  alert(mensagem);

  fecharModalNotaManual();

  document.getElementById("fornecedorManual").value = "";

  await carregarNotas();
}

async function importarXmlExistente(event, notaId) {
  const arquivo = event.target.files[0];

  if (!arquivo) return;

  const formData = new FormData();

  formData.append("xml", arquivo);

  const resposta = await fetch(
    `/nota/${notaId}/importar-xml`,
    {
      method: "POST",
      body: formData
    }
  );

  const mensagem = await resposta.text();

  alert(mensagem);

  await carregarNotas();
}

async function alterarStatusRapido(id, status) {

  await fetch(`/nota/${id}/status-unico`, {
    method: "POST",

    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },

    body: `status=${encodeURIComponent(status)}`
  });

}

if(
  usuario.cargo !== "admin" &&
  usuario.cargo !== "administrativo"
){
  window.location.href =
    "/login.html";
}

carregarNotas();
</script>
<div
  id="modalNotaManual"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:999;
  "
>
  <div class="card" style="width:400px;">
    <h2>Nova nota sem XML</h2>

    <label>Fornecedor</label>

    <input
      id="fornecedorManual"
      placeholder="Nome do fornecedor"
    >

    <br><br>

    <button onclick="salvarNotaManual()">
      Salvar
    </button>

    <button onclick="fecharModalNotaManual()">
      Cancelar
    </button>
  </div>
</div>
</body>
</html>
