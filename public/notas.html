<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Notas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Sistema de Notas - Jolupe</h1>
</header>

<main>
  <div class="card">
    <h2>Notas importadas</h2>

    <div class="top-links">
      <a href="/">Importar nova nota</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nota</th>
          <th>Fornecedor</th>
          <th>Data</th>
          <th>Adm.</th>
          <th>Estoque</th>
          <th>Marcação</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="listaNotas"></tbody>
    </table>
  </div>
</main>
<script>
function formatarData(data) {
  if (!data) return "-";

  const d = new Date(data);
  if (isNaN(d)) return data;

  return d.toLocaleDateString("pt-BR");
}

function classeStatus(texto) {
  if (!texto) return "status-alerta";

  const t = texto.toLowerCase();

  if (
    t.includes("finalizada") ||
    t.includes("conferida sem ocorrência") ||
    t.includes("marcada")
  ) {
    return "status-ok";
  }

  if (
    t.includes("ocorrência") ||
    t.includes("aguardando") ||
    t.includes("não liberada")
  ) {
    return "status-alerta";
  }

  return "status-alerta";
}

async function carregarNotas() {
  const resposta = await fetch("/notas");
  const notas = await resposta.json();

  const lista = document.getElementById("listaNotas");
  lista.innerHTML = "";

  const usuario = JSON.parse(localStorage.getItem("usuario"));

  const podeExcluir =
    usuario &&
    (
      usuario.cargo === "admin" ||
      usuario.cargo === "administrativo"
    );

  notas.forEach(nota => {
    lista.innerHTML += `
      <tr>
        <td><strong>${nota.numero}</strong></td>
        <td>${nota.fornecedor}</td>
        <td>${formatarData(nota.data)}</td>

        <td>
          <span class="status ${classeStatus(nota.status_administrativo)}">
            ${nota.status_administrativo || "Importada"}
          </span>
        </td>

        <td>
          <span class="status ${classeStatus(nota.status_estoque)}">
            ${nota.status_estoque || "Aguardando liberação"}
          </span>
        </td>

        <td>
          <span class="status ${classeStatus(nota.status_marcacao)}">
            ${nota.status_marcacao || "Não liberada"}
          </span>
        </td>

        <td>
          <a href="/nota.html?id=${nota.id}">Abrir nota</a>

          ${
            podeExcluir
              ? `<button onclick="excluirNota(${nota.id})">Excluir</button>`
              : ""
          }
        </td>
      </tr>
    `;
  });
}

async function excluirNota(id) {
  const confirmar = confirm("Tem certeza que deseja excluir esta nota?");

  if (!confirmar) return;

  await fetch(`/nota/${id}`, {
    method: "DELETE"
  });

  await carregarNotas();
}

carregarNotas();
</script>

</body>
</html>
