<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Notas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top-header">
  <h1>Sistema de Notas - Jolupe</h1>

  <img 
    src="https://jolupe.com.br/uploads/27/marca-jolupe.svg" 
    alt="Logo Jolupe"
    class="logo-jolupe"
  >
</header>

<main>
  <div class="card">
    <h2>Notas importadas</h2>

   <div class="top-links">
  <a href="/">Importar nova nota</a>

  <button onclick="abrirModalNotaManual()">
    Criar nota sem XML
  </button>
</div>

    <div id="modalNotaManual" class="modal" style="display:none;">
  <div class="card">
    <h2>Nova nota sem XML</h2>

    <label>Fornecedor</label>
    <input id="fornecedorManual">

    <br><br>

    <button onclick="salvarNotaManual()">
      Salvar
    </button>

    <button onclick="fecharModalNotaManual()">
      Cancelar
    </button>
  </div>
</div>


    <table>
      <thead>
       <tr>
        <th>Nota</th>
        <th>Fornecedor</th>
        <th>Data emissão</th>
        <th>Data recebimento</th>
        <th>Status</th>
        <th>Ação</th>
      </tr>
      </thead>
      <tbody id="listaNotas"></tbody>
    </table>
  </div>
</main>
<script>

function formatarData(data) {
  if (!data) return "-";

  data = String(data);

  if (data.includes("T")) {
    data = data.split("T")[0];
  }

  if (data.includes("-")) {
    const [ano, mes, dia] = data.split("-");

    return `${dia}/${mes}/${ano}`;
  }

  return data;
}

function classeStatus(texto) {
  if (!texto) return "status-alerta";

  const t = texto.toLowerCase();

  if (
    t.includes("finalizada") ||
    t.includes("conferida sem ocorrência") ||
    t.includes("marcada")
  ) {
    return "status-ok";
  }
  if (t.includes("aguardando xml")) {
  return "status-alerta";
}
  if (
    t.includes("ocorrência") ||
    t.includes("aguardando") ||
    t.includes("não liberada")
  ) {
    return "status-alerta";
  }

  return "status-alerta";
}

async function carregarNotas() {
  const resposta = await fetch("/notas");
  const notas = await resposta.json();

  const lista = document.getElementById("listaNotas");
  lista.innerHTML = "";

  const usuario = JSON.parse(localStorage.getItem("usuario"));

  const podeExcluir =
    usuario &&
    (
      usuario.cargo === "admin" ||
      usuario.cargo === "administrativo"
    );

  notas.forEach(nota => {
    lista.innerHTML += `
      <tr>
        <td>
          <strong>${nota.numero}</strong>
        </td>

        <td>${nota.fornecedor}</td>

        <td>${formatarData(nota.data)}</td>

        <td>${formatarData(nota.data_recebimento)}</td>

        <td>
          <span class="status ${classeStatus(nota.status)}">
            ${nota.status || "Importada"}
          </span>
        </td>

          <td>
  <a href="/nota.html?id=${nota.id}">
    Abrir
  </a>

  ${
    nota.status === "Aguardando XML"
      ? `
        <label class="botao-upload">
          Importar XML
          <input
            type="file"
            accept=".xml"
            onchange="importarXmlExistente(event, ${nota.id})"
            hidden
          >
        </label>
      `
      : ""
  }

  <button onclick="excluirNota(${nota.id})">
    Excluir
  </button>
</td>
      </tr>
    `;
  });
}

async function excluirNota(id) {
  const confirmar = confirm("Tem certeza que deseja excluir esta nota?");

  if (!confirmar) return;

  await fetch(`/nota/${id}`, {
    method: "DELETE"
  });

  await carregarNotas();
}

async function salvarNotaManual() {
  const fornecedor =
    document.getElementById("fornecedorManual").value;

  const resposta = await fetch("/nota/manual", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      fornecedor
    })
  });

  const mensagem = await resposta.text();

  alert(mensagem);

  fecharModalNotaManual();

  await carregarNotas();
}

function abrirModalNotaManual() {
  document.getElementById("modalNotaManual").style.display = "flex";
}

function fecharModalNotaManual() {
  document.getElementById("modalNotaManual").style.display = "none";
}

async function salvarNotaManual() {
  const fornecedor =
    document.getElementById("fornecedorManual").value;

  if (!fornecedor.trim()) {
    alert("Informe o fornecedor");
    return;
  }

  const resposta = await fetch("/nota/manual", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      fornecedor
    })
  });

  const mensagem = await resposta.text();

  alert(mensagem);

  fecharModalNotaManual();

  document.getElementById("fornecedorManual").value = "";

  await carregarNotas();
}

async function importarXmlExistente(event, notaId) {
  const arquivo = event.target.files[0];

  if (!arquivo) return;

  const formData = new FormData();

  formData.append("xml", arquivo);

  const resposta = await fetch(
    `/nota/${notaId}/importar-xml`,
    {
      method: "POST",
      body: formData
    }
  );

  const mensagem = await resposta.text();

  alert(mensagem);

  await carregarNotas();
}
carregarNotas();
</script>
<div
  id="modalNotaManual"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:999;
  "
>
  <div class="card" style="width:400px;">
    <h2>Nova nota sem XML</h2>

    <label>Fornecedor</label>

    <input
      id="fornecedorManual"
      placeholder="Nome do fornecedor"
    >

    <br><br>

    <button onclick="salvarNotaManual()">
      Salvar
    </button>

    <button onclick="fecharModalNotaManual()">
      Cancelar
    </button>
  </div>
</div>
</body>
</html>
